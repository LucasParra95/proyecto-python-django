{% extends 'index.html' %}
{% load custom_filters %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">{{ titulo }}</h2>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="form-group">
                            {{ form.as_p }}
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn {{ boton_clase|default:'btn-accent' }}">{{ boton_texto }}</button>
                            <a href="{{ url_cancelar }}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
