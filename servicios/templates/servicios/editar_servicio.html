{% extends 'index_servicio.html' %}

{% block form_editar_servicio %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">Editar Servicio</h2>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="form-group">
                            {{ form.as_p }}
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-accent">Actualizar Servicio</button>
                            <a href="{% url 'listar_servicios' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock form_editar_servicio %}
