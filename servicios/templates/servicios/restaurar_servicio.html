{% extends 'index_servicio.html' %}

{% block restaurar_servicio %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-success">
                <div class="card-header" style="background-color: #28a745;">
                    <h2 class="mb-0 text-white">Confirmar Restauración</h2>
                </div>
                <div class="card-body">
                    <p class="lead">¿Está seguro de que desea restaurar el servicio?</p>
                    <p><strong style="color: var(--accent-cta); font-size: 1.1rem;">{{ servicio.nombre }}</strong></p>
                    <p class="text-muted">El servicio volverá a estar activo en el sistema.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Restaurar Servicio</button>
                            <a href="{% url 'listar_servicios_inactivos' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock restaurar_servicio %}
