{% extends 'index.html' %}
{% load custom_filters %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-{{ color_alerta }}">
                <div class="card-header" style="background-color: {{ color_fondo }};">
                    <h2 class="mb-0 text-white">{{ titulo }}</h2>
                </div>
                <div class="card-body">
                    <p class="lead">{{ mensaje_confirmacion }}</p>
                    <p><strong style="color: var(--accent-cta); font-size: 1.1rem;">{{ nombre_display }}</strong></p>
                    {% if mensaje_adicional %}
                        <p class="text-muted">{{ mensaje_adicional }}</p>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn {{ boton_clase }}">{{ boton_texto }}</button>
                            <a href="{{ url_cancelar }}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
