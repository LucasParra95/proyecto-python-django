{% extends 'index_cliente.html' %}

{% block baja_cliente %}    
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header" style="background-color: #dc3545;">
                    <h2 class="mb-0 text-white">Confirmar Eliminación</h2>
                </div>
                <div class="card-body">
                    <p class="lead">¿Estás seguro de que deseas dar de baja el cliente?</p>
                    <p><strong style="color: var(--accent-cta); font-size: 1.1rem;">{{ cliente_nombre }}</strong></p>
                    <p class="text-muted">Este cliente será marcado como inactivo y podrá restaurarse más adelante.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Sí, dar de baja</button>
                            <a href="{% url 'listar_clientes' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
